<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d95349"/>
      <stop offset="100%" stop-color="#b93b3b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#752323" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded squircle / seal -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#sealGrad)" filter="url(#shadow)"/>
  <rect x="56" y="56" width="400" height="400" rx="76" fill="none" stroke="#fbe4e2" stroke-width="6" stroke-opacity="0.4" stroke-dasharray="16 8"/>
  
  <!-- Stylized Chinese character 华/语/汉 (Everyday Mandarin emblem) -->
  <g fill="#faf7f2" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="256" y="240" font-size="210">汉</text>
    <text x="256" y="380" font-size="44" letter-spacing="4" font-weight="600" opacity="0.95">EVERYDAY</text>
  </g>
</svg>
